schema_version: studio.credential-refs.v1
values_embedded: false
defaults:
  required_on_enable: true
  expose_to_tool_arguments: false
  expose_to_exports: false
  expose_to_logs: false
  allow_argv_injection: false
  source_file_mode: "0600"
  runtime_file_mode: "0400"

credential_refs:
  ref:opencode/codex-lb:
    kind: bearer_file
    files:
      token: { file_env: STUDIO_CODEX_API_KEY_FILE, source_path: ./.secrets/codex-lb/api-key, container_path: /run/secrets/studio_codex_api_key }
  ref:perplexity/websearch:
    kind: bearer_file
    files:
      token: { file_env: STUDIO_PERPLEXITY_API_KEY_FILE, source_path: ./.secrets/perplexity/api-key, container_path: /run/secrets/studio_perplexity_api_key }
  ref:studio/neo4j:
    kind: username_password_files
    files:
      username: { file_env: STUDIO_NEO4J_USERNAME_FILE, source_path: ./.secrets/neo4j/username, container_path: /run/secrets/studio_neo4j_username }
      password: { file_env: STUDIO_NEO4J_PASSWORD_FILE, source_path: ./.secrets/neo4j/password, container_path: /run/secrets/studio_neo4j_password }
  ref:studio/github:
    kind: bearer_file
    files:
      token: { file_env: STUDIO_GITHUB_TOKEN_FILE, source_path: ./.secrets/github/api-token, container_path: /run/secrets/studio_github_token }
  ref:studio/nocodb:
    kind: bearer_file
    files:
      token: { file_env: STUDIO_NOCODB_TOKEN_FILE, source_path: ./.secrets/nocodb/api-token, container_path: /run/secrets/studio_nocodb_token }
  ref:studio/qdrant:
    kind: bearer_file
    files:
      token: { file_env: STUDIO_QDRANT_API_KEY_FILE, source_path: ./.secrets/qdrant/api-key, container_path: /run/secrets/studio_qdrant_api_key }
  ref:studio/prometheus-basic:
    kind: basic_auth_files
    files:
      username: { file_env: STUDIO_PROMETHEUS_USERNAME_FILE, source_path: ./.secrets/prometheus/username, container_path: /run/secrets/studio_prometheus_username }
      password: { file_env: STUDIO_PROMETHEUS_PASSWORD_FILE, source_path: ./.secrets/prometheus/password, container_path: /run/secrets/studio_prometheus_password }
