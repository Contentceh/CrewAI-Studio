services:
  db:
    image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
    container_name: crewai-studio-db
    environment:
      POSTGRES_USER: crewai
      POSTGRES_DB: crewai
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - studio_db_data:/var/lib/postgresql/data
    networks:
      - db_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewai -d crewai"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crewai-studio
    depends_on:
      db:
        condition: service_healthy
      secret-init:
        condition: service_completed_successfully
    environment:
      AGENTOPS_ENABLED: "False"
      PYTHONUNBUFFERED: "1"
      CREWAI_KNOWLEDGE_DIR: /var/lib/crewai/knowledge
      CREWAI_EXPORT_DIR: /tmp/crewai-exports
      CREWAI_WORKSPACE_DIR: /var/lib/crewai/workspace
      STUDIO_MCP_POLICY_PATH: /etc/crewai/mcp/mcp-policy.yaml
    secrets:
      - postgres_password
    volumes:
      - studio_runtime_secret:/run/runtime-secrets:ro
      - studio_knowledge:/var/lib/crewai/knowledge
      - studio_workspace:/var/lib/crewai/workspace
      - studio_home:/home/crewai
      - ./config:/etc/crewai/mcp:ro
    networks:
      - proxy
      - db_internal
    expose:
      - "8501"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    cpus: 4.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  postgres_password:
    file: ../.secrets/postgres_password

volumes:
  studio_db_data:
  studio_runtime_secret:
  studio_knowledge:
  studio_exports:
  studio_workspace:
  studio_home:

networks:
  proxy:
    external: true
    name: crewai_panels_proxy
  db_internal:
    internal: true
